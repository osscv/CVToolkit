<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<link rel="stylesheet" href="https://appassets.androidplatform.net/assets/leaflet.css"/>
<script src="https://appassets.androidplatform.net/assets/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#e0e0e0}
#map{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%}
</style>
</head><body>
<div id="map"></div>
<script>
var mapDiv = document.getElementById('map');
mapDiv.style.height = window.innerHeight + 'px';
mapDiv.style.width = window.innerWidth + 'px';
var map = L.map('map',{zoomControl:true}).setView([1.35, 103.82], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OSM',
  maxZoom: 19
}).addTo(map);
var taxiLayer = L.layerGroup().addTo(map);

function resizeMap(){
  mapDiv.style.height = window.innerHeight + 'px';
  mapDiv.style.width = window.innerWidth + 'px';
  map.invalidateSize();
}
window.addEventListener('resize', resizeMap);
setTimeout(resizeMap, 100);
setTimeout(resizeMap, 500);
setTimeout(resizeMap, 1500);
setTimeout(resizeMap, 3000);

function updateTaxis(coords) {
  taxiLayer.clearLayers();
  for (var i = 0; i < coords.length; i++) {
    var c = coords[i];
    L.circleMarker([c[0], c[1]], {
      radius: 3,
      color: '#1565C0',
      fillColor: '#42A5F5',
      fillOpacity: 0.8,
      weight: 1
    }).addTo(taxiLayer);
  }
}

function setCount(n) {
  // no-op, count displayed natively
}
</script>
</body></html>
